
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextJob — Find Your Next Opportunity</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 20px 8%;
      border-bottom: 1px solid #e5eaf2;
    }

    .logo { color: #1769e0; font-size: 26px; font-weight: bold; }

    main { max-width: 760px; margin: 45px auto; padding: 20px; }

    .panel {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 24px #1720330d;
    }

    h1 { font-size: 32px; margin-top: 0; }
    .intro { color: #5b6578; line-height: 1.6; }

    label { display: block; margin-top: 20px; font-weight: bold; }

    input, select {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #ccd4e0;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 7px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #1054b9; }

    #results { margin-top: 30px; }
    .job {
      border: 1px solid #e0e6ef;
      border-radius: 9px;
      padding: 18px;
      margin-top: 12px;
    }

    .job h3 { margin: 0 0 8px; }
    .job p { color: #5b6578; }
    .job a { color: #1769e0; font-weight: bold; }

    .note { font-size: 13px; color: #697386; margin-top: 22px; }
  </style>
</head>
<body>
  <header><div class="logo">NextJob</div></header>

  <main>
    <section class="panel">
      <h1>Find your next opportunity</h1>
      <p class="intro">
        Tell us about your experience. We'll suggest job titles and help
        you find relevant vacancies.
      </p>

      <form id="jobForm">
        <label for="role">Your previous job title</label>
        <input id="role" value="Software Developer" required>

        <label for="experience">Years of experience</label>
        <select id="experience">
          <option>0–2 years</option>
          <option>3–5 years</option>
          <option selected>5–10 years</option>
          <option>10+ years</option>
        </select>

        <label for="location">Where do you want to work?</label>
        <select id="location">
          <option selected>United States</option>
          <option>United Kingdom</option>
          <option>Remote / international</option>
        </select>

        <button type="submit">Find My Next Job</button>
      </form>

      <div id="results" aria-live="polite"></div>
      <p class="note">
        NextJob links to external job searches. Vacancies and availability
        are determined by the job websites.
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("jobForm");
    const results = document.getElementById("results");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const role = document.getElementById("role").value.trim();
      const experience = document.getElementById("experience").value;
      const location = document.getElementById("location").value;

      if (!role) {
        results.innerHTML = "<p>Please enter your previous job title.</p>";
        return;
      }

      const suggestions = getSuggestions(role);
      const actionPlan = createActionPlan(role, experience, location);
      const searchLocation =
        location === "Remote / international" ? "Remote" : location;

      results.innerHTML = `
        <h2>Job ideas for you</h2>
        <p>
          Based on <strong>${escapeHtml(role)}</strong>,
          <strong>${escapeHtml(experience)}</strong> of experience,
          and your preferred location of
          <strong>${escapeHtml(location)}</strong>.
        </p>
        ${suggestions.map(title => `
          <article class="job">
            <h3>${escapeHtml(title)}</h3>
            <p>A potential role to explore based on your experience.</p>
            <a href="${makeSearchUrl(title, searchLocation)}"
               target="_blank" rel="noopener noreferrer">
              Search jobs on Indeed ↗
            </a>
          </article>
        `).join("")}
      ` + actionPlan;
    });

    function getSuggestions(role) {
      const r = role.toLowerCase();

      if (r.includes("software developer") || r.includes("software engineer")
          || r.includes("programmer")) {
        return [
          "Software Developer",
          "Software Engineer",
          "Backend Developer",
          "Full Stack Developer",
          "Technical Lead"
        ];
      }

      if (r.includes("business analyst")) {
        return [
          "Business Analyst",
          "Senior Business Analyst",
          "Product Analyst",
          "Systems Analyst",
          "Product Owner"
        ];
      }

      if (r.includes("test") || r.includes("qa") || r.includes("quality")) {
        return [
          "QA Engineer",
          "Software Test Engineer",
          "Automation Test Engineer",
          "Test Lead",
          "Quality Engineering Lead"
        ];
      }

      if (r.includes("architect")) {
        return [
          "Solution Architect",
          "Technical Architect",
          "Software Architect",
          "Cloud Architect",
          "Principal Engineer"
        ];
      }

      if (r.includes("project manager")) {
        return [
          "Project Manager",
          "Technical Project Manager",
          "Programme Manager",
          "Delivery Manager",
          "Scrum Master"
        ];
      }

      return [
        role,
        "Senior " + role,
        role + " Consultant",
        "Team Lead",
        "Related Specialist"
      ];
    }

    function makeSearchUrl(title, location) {
      const query = title + " " + location;
      return "https://www.indeed.com/jobs?q=" + encodeURIComponent(query);
    }

    
function createActionPlan(role, experience, location) {
  const safeRole = escapeHtml(role);
  const safeExperience = escapeHtml(experience);
  const safeLocation = escapeHtml(location);

  return `
    <section class="panel" style="margin-top:24px">
      <h2>Your personalised job-search plan</h2>
      <p>
        Your starting point: <strong>${safeRole}</strong>,
        <strong>${safeExperience}</strong> of experience,
        looking in <strong>${safeLocation}</strong>.
      </p>

      <h3>Today — Get ready</h3>
      <ul>
        <li>Update your CV to highlight your strongest technical skills and achievements.</li>
        <li>Update your LinkedIn profile and mark yourself open to relevant opportunities.</li>
        <li>Choose three job titles to focus your search on.</li>
      </ul>

      <h3>This week — Start applying</h3>
      <ul>
        <li>Set up job alerts for your chosen roles and location.</li>
        <li>Identify 10 suitable vacancies and prioritise those matching your experience.</li>
        <li>Tailor your CV for each application rather than sending the same version everywhere.</li>
        <li>Contact former colleagues and professional connections to ask about opportunities.</li>
      </ul>

      <h3>Next two weeks — Build momentum</h3>
      <ul>
        <li>Aim for a manageable number of well-matched applications each week.</li>
        <li>Practise explaining your recent projects and the impact you delivered.</li>
        <li>Prepare examples for technical interviews and problem-solving questions.</li>
        <li>Review your progress weekly and adjust your search if you are not getting responses.</li>
      </ul>

      <h3>Your daily checklist</h3>
      <label style="font-weight:normal">
        <input type="checkbox" style="width:auto;margin-right:8px">
        Find and review relevant vacancies
      </label>
      <label style="font-weight:normal">
        <input type="checkbox" style="width:auto;margin-right:8px">
        Complete one useful application
      </label>
      <label style="font-weight:normal">
        <input type="checkbox" style="width:auto;margin-right:8px">
        Contact one professional connection
      </label>
      <label style="font-weight:normal">
        <input type="checkbox" style="width:auto;margin-right:8px">
        Spend 20 minutes preparing for interviews
      </label>

      <p class="note">
        This plan is a starting point, not a guarantee of employment.
        Your checklist resets when you refresh the page.
      </p>
    </section>
  `;
}


    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }
  </script>
</body>
</html>
